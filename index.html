<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#bfe3f2" />
    <title>Ferme aux chats</title>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="ui">
      <div id="hud-haut">
        <span class="pastille" id="hud-jour"></span>
        <span class="pastille">🪙 <span id="hud-argent">0</span></span>
        <span class="pastille">🌰 Graines <span id="hud-graines">0</span></span>
        <span class="pastille">🧺 Radis <span id="hud-radis">0</span></span>
      </div>
      <div id="hud-boutons">
        <button id="btn-acheter" type="button">Acheter une graine</button>
        <button id="btn-vendre" type="button">Vendre la récolte</button>
        <button id="btn-dormir" type="button">Dormir 🌙</button>
      </div>
      <div id="toast" role="status"></div>
    </div>
    <div id="nuit"><div id="nuit-texte"></div></div>
    <div id="rotate">
      <div class="rotate-icon">↻</div>
      <p>Tourne ton téléphone en paysage</p>
      <button id="rotate-skip" type="button">Continuer quand même</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
